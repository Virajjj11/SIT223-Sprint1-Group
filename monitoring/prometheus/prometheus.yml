global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - alert-rules.yml

scrape_configs:
  - job_name: tracker-production
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:3000"]
        labels:
          environment: production

  - job_name: tracker-staging
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:3001"]
        labels:
          environment: staging

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
