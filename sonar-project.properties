sonar.projectKey=Virajjj11_SIT223-Sprint1-Group
sonar.organization=virajjj11
sonar.host.url=https://sonarcloud.io
sonar.projectName=SIT223 Unit Task Tracker

# What to analyse
sonar.sources=src,public,Dockerfile
sonar.tests=tests
sonar.exclusions=public/logo.svg
sonar.sourceEncoding=UTF-8

# Test coverage from Jest
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# The browser-side script and the tiny server entry point are not unit tested,
# so they are excluded from coverage (they are still checked for bugs and code smells).
sonar.coverage.exclusions=public/**,src/server.js
